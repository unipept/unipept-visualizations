# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    # @types/d3 is the only runtime dependency: d3 itself is bundled into the
    # published file, so only the types it leaves behind in dist/*.d.ts have to
    # resolve for a consumer. It gets its own PR because it is the one bump that
    # can reach them; everything else is tooling and arrives as one batch
    # instead of a dozen separate PRs.
    groups:
      production:
        dependency-type: "production"
      development:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
